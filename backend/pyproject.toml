[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "S101", "S105", "S106", "B008"]  # long lines, asserts in tests, test passwords, FastAPI Depends()

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestCollectionWarning"]
