name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: portfolio_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff bandit pip-audit
      - name: Lint
        run: ruff check app tests
      - name: Static security analysis
        run: bandit -q -r app -ll
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests on PostgreSQL + Redis
        env:
          TEST_DATABASE_URL: postgresql+psycopg://portfolio:portfolio@localhost:5432/portfolio_test
        run: pytest -q
      - name: Migrations apply, roll back and re-apply on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://portfolio:portfolio@localhost:5432/portfolio_test
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.core.db import get_engine
          from app.models.base import Base
          with get_engine().begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          PY
          alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build -t portfolio-backend ./backend
          docker build --target prod -t portfolio-frontend ./frontend
      - name: Validate production compose file
        run: |
          cp .env.example .env
          echo "DOMAIN=example.test" >> .env
          echo "REDIS_PASSWORD=ci" >> .env
          docker compose -f docker-compose.prod.yml --env-file .env config -q
