# Production stack: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Only Caddy publishes ports. Database, Redis and the API are reachable only on the internal network.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [frontend]

  frontend:
    build: { context: ./frontend, target: prod }
    restart: unless-stopped
    depends_on: [backend]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      RATE_LIMIT_BACKEND: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes: ["media:/app/media"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      MEDIA_DIR: /media
    volumes: ["./scripts:/scripts:ro", "backups:/backups", "media:/media:ro"]
    entrypoint: ["sh", "-c", "while true; do /scripts/backup.sh || echo 'BACKUP FAILED'; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

volumes: { pgdata: {}, media: {}, backups: {}, caddy_data: {}, caddy_config: {} }
