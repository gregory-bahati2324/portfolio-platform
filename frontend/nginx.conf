# Served inside the frontend container, behind the TLS-terminating proxy (Caddy).
# Link-preview and search bots that do not run JavaScript get real <title>/Open Graph
# tags from the backend's /_meta endpoint. Everyone else gets the single-page app.
map $http_user_agent $is_preview_bot {
  default 0;
  "~*(facebookexternalhit|WhatsApp|LinkedInBot|Twitterbot|Slackbot|TelegramBot|Discordbot|Googlebot|bingbot|DuckDuckBot)" 1;
}

upstream backend_app { server backend:8000; keepalive 16; }

server {
  listen 80;
  server_tokens off;
  client_max_body_size 250m;   # video uploads; matches MAX_VIDEO_MB
  root /usr/share/nginx/html;

  # Only trust X-Forwarded-For from our own private networks (the proxy in front of us), so a
  # visitor cannot fake their IP to dodge rate limits.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 500;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  set $proxy_proto $http_x_forwarded_proto;
  if ($proxy_proto = "") { set $proxy_proto $scheme; }

  location /api/ {
    proxy_pass http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_read_timeout 60s;
  }
  location /media/ { proxy_pass http://backend_app; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Connection ""; }
  location = /sitemap.xml { proxy_pass http://backend_app; proxy_set_header Host $host; }
  location = /robots.txt { proxy_pass http://backend_app; proxy_set_header Host $host; }

  location /assets/ {   # content-hashed by the build, safe to cache forever
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /__bot_meta {
    internal;
    proxy_pass http://backend_app/_meta?path=$orig_uri;
    proxy_set_header Host $host;
  }

  location / {
    set $orig_uri $uri;
    if ($is_preview_bot) { rewrite ^ /__bot_meta last; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri /index.html;
  }
}
